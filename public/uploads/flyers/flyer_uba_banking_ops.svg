<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
    <defs>
      <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#450A0A"/>
        <stop offset="50%" stop-color="#090D1A"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="headerGrad4" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#EF4444"/>
        <stop offset="100%" stop-color="#FBBF24"/>
      </linearGradient>
    </defs>

    <!-- Background card with high-tech pattern -->
    <rect width="600" height="800" fill="url(#bgGrad4)"/>
    <rect x="15" y="15" width="570" height="770" rx="24" fill="none" stroke="#EF4444" stroke-width="2" stroke-opacity="0.35"/>
    <rect x="22" y="22" width="556" height="756" rx="18" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Geometric background accents -->
    <circle cx="520" cy="80" r="140" fill="#EF4444" fill-opacity="0.06"/>
    <circle cx="60" cy="720" r="180" fill="#FBBF24" fill-opacity="0.05"/>

    <!-- Top Brand Header Bar -->
    <rect x="30" y="32" width="540" height="64" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Top Cameroon Flag Accent -->
    <rect x="42" y="48" width="8" height="32" fill="#007A5E" rx="2"/>
    <rect x="52" y="48" width="8" height="32" fill="#CE1126" rx="2"/>
    <rect x="62" y="48" width="8" height="32" fill="#FCD116" rx="2"/>

    <text x="82" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#EF4444" letter-spacing="2">AVIS OFFICIEL DE RECRUTEMENT</text>
    <text x="82" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">UBA CAMEROON (UNITED BANK FOR AFRICA)</text>

    <!-- National Certified Seal -->
    <rect x="430" y="44" width="128" height="40" rx="8" fill="#3B82F6" fill-opacity="0.18" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="494" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#3B82F6" text-anchor="middle" letter-spacing="0.5">OFFRE D’EMPLOI / CDD-CDI</text>

    <!-- Main Title Box -->
    <rect x="30" y="112" width="540" height="130" rx="16" fill="rgba(0,0,0,0.6)" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="48" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FBBF24" letter-spacing="1.5">RECRUTEMENT JEUNE DIPLÔMÉ</text>
    
    <!-- Multi-line title -->
    <text x="48" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" width="500">
      CHARGE D’ACCUEIL & ASSISTANT AUDIT D’A
    </text>
    <text x="48" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#EF4444">
      GENCE
    </text>
    <text x="48" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
      📍 DOUALA & YAOUNDÉ  •  ⏳ Date Limite : 28 DÉCEMBRE 2026
    </text>

    <!-- Summary Box -->
    <rect x="30" y="258" width="540" height="74" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="48" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#EF4444">MISSIONS &amp; OBJECTIFS DU POSTE :</text>
    <text x="48" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">Opportunité d’insertion rapide au sein des agences bancaires de référence U</text>
    <text x="48" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">BA Cameroun.</text>

    <!-- Key Details Grid -->
    <rect x="30" y="348" width="260" height="88" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)"/>
    <text x="45" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#94A3B8">RÉMUNÉRATION / INDEMNITÉ :</text>
    <text x="45" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#10B981">250,000 FCFA / MOIS</text>
    <text x="45" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B">Convention tripartite assurée</text>

    <rect x="310" y="348" width="260" height="88" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)"/>
    <text x="325" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#94A3B8">NIVEAU ACADÉMIQUE REQUIS :</text>
    <text x="325" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Bac+3 / Bac+5 en Banque, Finance</text>
    <text x="325" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#FBBF24">, Comptabilité</text>

    <!-- Required Skills Strip -->
    <rect x="30" y="450" width="540" height="84" rx="14" fill="rgba(255,255,255,0.04)" stroke="#EF4444" stroke-width="1" stroke-opacity="0.3"/>
    <text x="48" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#EF4444" letter-spacing="1">COMPÉTENCES &amp; OUTILS CLÉS :</text>
    <text x="48" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Gestion de Caisse • Conformité AML/KYC • Accueil Clientèle • Excel Avancé</text>

    <!-- How to apply & WhatsApp Contact -->
    <rect x="30" y="550" width="540" height="124" rx="16" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="2"/>
    <circle cx="68" cy="612" r="24" fill="#10B981"/>
    <!-- Phone / WhatsApp icon -->
    <path d="M60 604 C 60 620, 76 620, 76 604" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <circle cx="68" cy="612" r="10" fill="#FFFFFF"/>
    
    <text x="108" y="582" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#10B981" letter-spacing="0.5">POSTULER DIRECTEMENT SUR WHATSAPP :</text>
    <text x="108" y="608" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">+237 678 99 00 11</text>
    <text x="108" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#A7F3D0">Envoyez votre CV + Référence : UBA -2026</text>
    <text x="108" y="648" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#6EE7B7">Validation immédiate via la plateforme MANTECH Nexus</text>

    <!-- Bottom Footer Certification -->
    <rect x="30" y="690" width="540" height="66" rx="12" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="48" y="718" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94A3B8">PLATEFORME NATIONALE D’INSERTION &amp; DE STAGES AU CAMEROUN</text>
    <text x="48" y="738" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#38BDF8">MANTECH NEXUS // VÉRIFIÉ &amp; ENREGISTRÉ CONFORME</text>
    <text x="548" y="728" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#EF4444" text-anchor="end">RÉGION DOUALA</text>
  </svg>