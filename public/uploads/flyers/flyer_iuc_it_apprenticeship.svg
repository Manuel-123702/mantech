<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
    <defs>
      <linearGradient id="bgGrad12" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1E293B"/>
        <stop offset="50%" stop-color="#090D1A"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="headerGrad12" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#A855F7"/>
      </linearGradient>
    </defs>

    <!-- Background card with high-tech pattern -->
    <rect width="600" height="800" fill="url(#bgGrad12)"/>
    <rect x="15" y="15" width="570" height="770" rx="24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.35"/>
    <rect x="22" y="22" width="556" height="756" rx="18" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Geometric background accents -->
    <circle cx="520" cy="80" r="140" fill="#38BDF8" fill-opacity="0.06"/>
    <circle cx="60" cy="720" r="180" fill="#A855F7" fill-opacity="0.05"/>

    <!-- Top Brand Header Bar -->
    <rect x="30" y="32" width="540" height="64" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Top Cameroon Flag Accent -->
    <rect x="42" y="48" width="8" height="32" fill="#007A5E" rx="2"/>
    <rect x="52" y="48" width="8" height="32" fill="#CE1126" rx="2"/>
    <rect x="62" y="48" width="8" height="32" fill="#FCD116" rx="2"/>

    <text x="82" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="2">AVIS OFFICIEL DE RECRUTEMENT</text>
    <text x="82" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1">INSTITUT UNIVERSITAIRE DE LA CÔTE (IUC)</text>

    <!-- National Certified Seal -->
    <rect x="430" y="44" width="128" height="40" rx="8" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1.5"/>
    <text x="494" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#10B981" text-anchor="middle" letter-spacing="0.5">STAGE ACADÉMIQUE / PRO</text>

    <!-- Main Title Box -->
    <rect x="30" y="112" width="540" height="130" rx="16" fill="rgba(0,0,0,0.6)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="48" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#A855F7" letter-spacing="1.5">STAGE ACADÉMIQUE DE FIN D’ÉTUDES</text>
    
    <!-- Multi-line title -->
    <text x="48" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" width="500">
      STAGE ACADÉMIQUE ADMINISTRATEUR SYSTÈM
    </text>
    <text x="48" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#38BDF8">
      ES & LABS
    </text>
    <text x="48" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
      📍 DOUALA (CAMPUS LOGBESSOU)  •  ⏳ Date Limite : 25 DÉCEMBRE 2026
    </text>

    <!-- Summary Box -->
    <rect x="30" y="258" width="540" height="74" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="48" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">MISSIONS &amp; OBJECTIFS DU POSTE :</text>
    <text x="48" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">Support technique et maintenance de l’infrastructure réseau des campus univ</text>
    <text x="48" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">ersitaires.</text>

