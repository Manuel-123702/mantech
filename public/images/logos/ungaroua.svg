<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_ungarouasvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_ungarouasvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#FEF08A" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#FEF08A" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#FEF08A" stroke-width="3.5"/>
              <polygon points="0,-16 4,-4 16,-4 6,4 10,16 0,8 -10,16 -6,4 -16,-4 -4,-4" fill="#FACC15"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FEF08A" letter-spacing="1.5">
    UNIV-GAROUA
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FEF08A" opacity="0.85" letter-spacing="0.5">
    UNIVERSITÉ DE GAROUA
  </text>
</svg>