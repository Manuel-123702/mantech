<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_underesvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_underesvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#E9D5FF" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#E9D5FF" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <polygon points="0,-24 22,-8 14,20 -14,20 -22,-8" fill="#A855F7"/>
              <circle cx="0" cy="-2" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#E9D5FF" letter-spacing="1.5">
    UNIV-NDÉRÉ
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#E9D5FF" opacity="0.85" letter-spacing="0.5">
    UNIVERSITÉ DE NGAOUNDÉRÉ
