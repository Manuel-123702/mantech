<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_fomicsvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_fomicsvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#FED7AA" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#FED7AA" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <rect x="-16" y="-20" width="32" height="40" rx="4" fill="none" stroke="#FED7AA" stroke-width="3.5"/>
              <polygon points="0,-10 6,4 -6,4" fill="#FBBF24"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FED7AA" letter-spacing="1.5">
    FOMIC
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FED7AA" opacity="0.85" letter-spacing="0.5">
    POLYTECHNIC BUEA
  </text>
</svg>