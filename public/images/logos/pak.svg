<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_paksvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_paksvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <circle cx="0" cy="-14" r="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
              <line x1="0" y1="-6" x2="0" y2="24" stroke="#FFFFFF" stroke-width="4.5"/>
              <line x1="-16" y1="0" x2="16" y2="0" stroke="#FFFFFF" stroke-width="4"/>
              <path d="M -24 10 C -18 26, 18 26, 24 10" stroke="#38BDF8" stroke-width="4.5" fill="none"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    PAK
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" opacity="0.85" letter-spacing="0.5">
    PORT DE KRIBI
  </text>
</svg>