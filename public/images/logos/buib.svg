<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_buibsvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_buibsvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#E0F2FE" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#E0F2FE" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <rect x="-8" y="-22" width="16" height="44" rx="3" fill="#DC2626"/>
              <rect x="-22" y="-8" width="44" height="16" rx="3" fill="#DC2626"/>
              <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#E0F2FE" letter-spacing="1.5">
    BUIB
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#E0F2FE" opacity="0.85" letter-spacing="0.5">
    HEALTH & MANAGEMENT
  </text>
</svg>