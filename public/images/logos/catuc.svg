<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_catucsvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_catucsvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#BFDBFE" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#BFDBFE" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <line x1="0" y1="-26" x2="0" y2="22" stroke="#BFDBFE" stroke-width="4"/>
              <line x1="-14" y1="-10" x2="14" y2="-10" stroke="#BFDBFE" stroke-width="4"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#BFDBFE" letter-spacing="1.5">
    CATUC
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#BFDBFE" opacity="0.85" letter-spacing="0.5">
    CATHOLIC UNIVERSITY
