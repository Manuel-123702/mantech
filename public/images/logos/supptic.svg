<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_suppticsvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_suppticsvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#7DD3FC" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <path d="M -18 8 A 20 20 0 0 1 18 8" stroke="#7DD3FC" stroke-width="3.5" fill="none"/>
              <path d="M -10 12 A 12 12 0 0 1 10 12" stroke="#7DD3FC" stroke-width="3.5" fill="none"/>
              <circle cx="0" cy="14" r="4" fill="#FBBF24"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#7DD3FC" letter-spacing="1.5">
    SUP'PTIC
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#7DD3FC" opacity="0.85" letter-spacing="0.5">
    POSTES & TÉLÉCOMS
  </text>
</svg>