<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_unibasvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_unibasvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#CCFBF1" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#CCFBF1" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <rect x="-18" y="-18" width="36" height="36" rx="6" fill="none" stroke="#CCFBF1" stroke-width="3.5"/>
              <polygon points="0,-12 10,8 -10,8" fill="#FBBF24"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#CCFBF1" letter-spacing="1.5">
    UBA
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#CCFBF1" opacity="0.85" letter-spacing="0.5">
    UNIVERSITY OF BAMENDA
  </text>
</svg>