<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_stjeromesvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_stjeromesvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#BAE6FD" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <line x1="0" y1="-24" x2="0" y2="20" stroke="#BAE6FD" stroke-width="4"/>
              <line x1="-14" y1="-10" x2="14" y2="-10" stroke="#BAE6FD" stroke-width="4"/>
              <polygon points="0,-24 4,-14 14,-14 6,-6 9,4 0,0 -9,4 -6,-6 -14,-14 -4,-14" fill="#FBBF24"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#BAE6FD" letter-spacing="1.5">
    ST-JÉRÔME
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#BAE6FD" opacity="0.85" letter-spacing="0.5">
    UNIVERSITAIRE CATHOLIQUE
  </text>
</svg>