<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_ubueasvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_ubueasvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#A7F3D0" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <polygon points="0,-22 24,18 -24,18" fill="none" stroke="#A7F3D0" stroke-width="3.5"/>
              <circle cx="0" cy="-6" r="6" fill="#FBBF24"/>
              <line x1="-12" y1="6" x2="12" y2="6" stroke="#A7F3D0" stroke-width="2.5"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#A7F3D0" letter-spacing="1.5">
    UB
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#A7F3D0" opacity="0.85" letter-spacing="0.5">
