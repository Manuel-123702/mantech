<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_essecsvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_essecsvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#FDE047" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#FDE047" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <rect x="-18" y="-18" width="36" height="36" rx="6" fill="#FDE047"/>
              <text x="0" y="8" font-size="18" font-weight="900" fill="#0F172A" text-anchor="middle">E</text>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FDE047" letter-spacing="1.5">
    ESSEC
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FDE047" opacity="0.85" letter-spacing="0.5">
    SCIENCES ÉCONOMIQUES
  </text>
</svg>