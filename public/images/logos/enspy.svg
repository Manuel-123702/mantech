<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_enspysvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_enspysvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#FCA5A5" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#FCA5A5" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <circle cx="0" cy="0" r="14" fill="#DC2626" stroke="#FCA5A5" stroke-width="3"/>
              <circle cx="0" cy="0" r="24" fill="none" stroke="#FCA5A5" stroke-width="3" stroke-dasharray="8 5"/>
              <polygon points="0,-8 3,-2 8,-2 4,2 6,8 0,4 -6,8 -4,2 -8,-2 -3,-2" fill="#FFFFFF"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FCA5A5" letter-spacing="1.5">
    ENSPY
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FCA5A5" opacity="0.85" letter-spacing="0.5">
    POLYTECHNIQUE YAOUNDÉ
  </text>
</svg>