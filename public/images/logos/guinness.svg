<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_guinnesssvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_guinnesssvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <path d="M -16 -20 Q 16 -24 16 0 Q 16 24 -16 20 Z" fill="none" stroke="#F59E0B" stroke-width="4"/>
              <line x1="-12" y1="-14" x2="12" y2="4" stroke="#F59E0B" stroke-width="2"/>
              <line x1="-12" y1="-4" x2="12" y2="10" stroke="#F59E0B" stroke-width="2"/>
              <line x1="-12" y1="6" x2="12" y2="16" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#F59E0B" letter-spacing="1.5">
