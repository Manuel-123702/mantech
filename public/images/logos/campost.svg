<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_campostsvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_campostsvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <rect x="-24" y="-16" width="48" height="32" rx="4" fill="#1E3A8A"/>
              <path d="M -24 -16 L 0 4 L 24 -16" stroke="#FACC15" stroke-width="3" fill="none"/>
              <circle cx="0" cy="-2" r="4" fill="#FACC15"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#1E3A8A" letter-spacing="1.5">
    CAMPOST
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1E3A8A" opacity="0.85" letter-spacing="0.5">
    POSTE & SERVICES
  </text>
</svg>