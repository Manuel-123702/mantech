<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_afrilandsvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F3876"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_afrilandsvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#F59E0B" stroke-width="4"/>
              <path d="M -14 12 L 0 -18 L 14 12 Z" fill="#F59E0B"/>
              <circle cx="0" cy="-2" r="5" fill="#0F3876"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#F59E0B" letter-spacing="1.5">
    AFRILAND
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#F59E0B" opacity="0.85" letter-spacing="0.5">
    FIRST BANK
  </text>
</svg>