<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_camairsvg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="200" height="200" rx="36" fill="url(#bg_camairsvg)"/>
  <rect x="4" y="4" width="192" height="192" rx="32" fill="none" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="100" cy="85" r="54" fill="none" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Brand Emblem Graphic -->
  <g transform="translate(100, 78)">
    <path d="M -28 10 Q 0 -24 28 -8 Q 10 16 -28 10 Z" fill="#FBBF24"/>
              <polygon points="0,-16 4,-6 14,-6 6,0 9,10 0,4 -9,10 -6,0 -14,-6 -4,-6" fill="#DC2626"/>
  </g>

  <!-- Brand Initials Badge -->
  <text x="100" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#FBBF24" letter-spacing="1.5">
    CAMAIR-CO
  </text>

  <!-- Brand Subtitle / Category -->
  <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FBBF24" opacity="0.85" letter-spacing="0.5">
    THE STAR OF CAMEROON
  </text>
</svg>